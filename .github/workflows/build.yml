name: Build

# Every pull request (and every push to main) is built, unit-tested and linted, so a change that breaks
# something shows a red ✗ on the pull request before it is merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # No local.properties here: the Trakt / Nuvio / Simkl app ids are empty, which the app handles.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build the APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          retention-days: 7
